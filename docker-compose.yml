services:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mujcode_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      HOST: "0.0.0.0"
      NODE_ENV: production
      TOKEN_SECRET: ${TOKEN_SECRET:?TOKEN_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DB_FILE: /app/src/data/db.json
      UPLOAD_DIR: /app/uploads
      MONGODB_URI: ${MONGODB_URI:-}
      REDIS_URI: redis://redis:6379
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0_server:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/src/data
    networks:
      - mujcode-net
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: mujcode_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - mujcode-net
    depends_on:
      backend:
        condition: service_healthy

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mujcode_redis
    restart: unless-stopped
    networks:
      - mujcode-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MongoDB (optional — for ATS/Placement features) ───────────────────────
  mongodb:
    image: mongo:7
    container_name: mujcode_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD is required}
    networks:
      - mujcode-net
    volumes:
      - mongodb_data:/data/db
    profiles:
      - ats

  # ── Judge0 Services (Self-Hosted Code Execution Engine) ───────────────────
  judge0_server:
    image: judge0/judge0:v1.13.1
    container_name: mujcode_judge0_server
    restart: unless-stopped
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - judge0_db
      - judge0_redis
    networks:
      - mujcode-net
    profiles:
      - judge0
      - full

  judge0_worker:
    image: judge0/judge0:v1.13.1
    container_name: mujcode_judge0_worker
    restart: unless-stopped
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - judge0_db
      - judge0_redis
    networks:
      - mujcode-net
    profiles:
      - judge0
      - full

  judge0_db:
    image: postgres:13-alpine
    container_name: mujcode_judge0_db
    restart: unless-stopped
    env_file: ./judge0/judge0.conf
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    networks:
      - mujcode-net
    profiles:
      - judge0
      - full

  judge0_redis:
    image: redis:7-alpine
    container_name: mujcode_judge0_redis
    restart: unless-stopped
    command: ["sh", "-c", "docker-entrypoint.sh --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    env_file: ./judge0/judge0.conf
    volumes:
      - judge0_redis_data:/data
    networks:
      - mujcode-net
    profiles:
      - judge0
      - full

# ── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  backend_uploads:
    name: mujcode_uploads
  backend_data:
    name: mujcode_data
  redis_data:
    name: mujcode_redis_data
  mongodb_data:
    name: mujcode_mongodb_data
  judge0_db_data:
    name: mujcode_judge0_db_data
  judge0_redis_data:
    name: mujcode_judge0_redis_data

# ── Network ───────────────────────────────────────────────────────────────
networks:
  mujcode-net:
    name: mujcode-network
    driver: bridge
