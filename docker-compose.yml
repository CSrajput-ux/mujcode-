services:
  # ── Backend ──────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      replicas: 5
    environment:
      PORT: 5000
      HOST: "0.0.0.0"
      NODE_ENV: production
      TOKEN_SECRET: ${TOKEN_SECRET:-mujcode-secure-default-secret-please-change-in-production}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DB_FILE: /app/src/data/db.json
      UPLOAD_DIR: /app/uploads
      POSTGRES_URI: ${POSTGRES_URI:-postgres://postgres:postgres@postgres:5432/mujcode_db}
      MONGODB_URI: ${MONGODB_URI:-}
      REDIS_URI: redis://redis:6379
      JUDGE0_URL: ${JUDGE0_URL:-http://judge0_server:2358}
      JUDGE0_AUTH_TOKEN: ${JUDGE0_AUTH_TOKEN:-}
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/src/data
    networks:
      - mujcode-net
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── NGINX Load Balancer ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mujcode_nginx
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - mujcode-net

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://mujcode-1.onrender.com}
    container_name: mujcode_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - mujcode-net
    depends_on:
      backend:
        condition: service_healthy

  # ── PostgreSQL Database (Primary Storage Engine) ──────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: mujcode_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mujcode_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mujcode-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: mujcode_redis
    restart: unless-stopped
    networks:
      - mujcode-net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── MongoDB (optional — for ATS/Placement features) ───────────────────────
  mongodb:
    image: mongo:7
    container_name: mujcode_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-mujcode_mongo_secure_pass_491823}
    networks:
      - mujcode-net
    volumes:
      - mongodb_data:/data/db
    profiles:
      - ats

  # ── Judge0 Services (Self-Hosted Code Execution Engine) ───────────────────
  judge0_server:
    image: judge0/judge0:v1.13.1
    container_name: mujcode_judge0_server
    restart: unless-stopped
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    env_file: ./judge0/judge0.conf
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - judge0_db
      - judge0_redis
    networks:
      - mujcode-net
    profiles:
      - judge0
      - full

  judge0_worker:
    image: judge0/judge0:v1.13.1
    restart: unless-stopped
    deploy:
      replicas: 10
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    env_file: ./judge0/judge0.conf
    privileged: true
    depends_on:
      - judge0_db
      - judge0_redis
    networks:
      - mujcode-net
    profiles:
      - judge0
      - full

  judge0_db:
    image: postgres:13-alpine
    container_name: mujcode_judge0_db
    restart: unless-stopped
    env_file: ./judge0/judge0.conf
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    networks:
      - mujcode-net
    profiles:
      - judge0
      - full

  judge0_redis:
    image: redis:7-alpine
    container_name: mujcode_judge0_redis
    restart: unless-stopped
    command: ["sh", "-c", "docker-entrypoint.sh --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    env_file: ./judge0/judge0.conf
    volumes:
      - judge0_redis_data:/data
    networks:
      - mujcode-net
    profiles:
      - judge0
      - full

# ── Named Volumes ─────────────────────────────────────────────────────────
volumes:
  backend_uploads:
    name: mujcode_uploads
  backend_data:
    name: mujcode_data
  redis_data:
    name: mujcode_redis_data
  postgres_data:
    name: mujcode_postgres_data
  mongodb_data:
    name: mujcode_mongodb_data
  judge0_db_data:
    name: mujcode_judge0_db_data
  judge0_redis_data:
    name: mujcode_judge0_redis_data

# ── Network ───────────────────────────────────────────────────────────────
networks:
  mujcode-net:
    name: mujcode-network
    driver: bridge
