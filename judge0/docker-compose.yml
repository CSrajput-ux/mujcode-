# ==============================================================================
# Self-Hosted Judge0 CE (v1.13.1) Orchestration — Production Hardened
# ==============================================================================
# Official repository: https://github.com/judge0/judge0
# Prerequisites on Ubuntu Linux host:
#   systemd.unified_cgroup_hierarchy=0 in /etc/default/grub (for isolate cgroups v1)
# ==============================================================================

version: '3.8'

services:
  # ── Judge0 Server (API Gateway) ───────────────────────────────────────────
  server:
    image: judge0/judge0:1.13.1
    container_name: judge0_server
    restart: unless-stopped
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mujcode-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2358/system_info"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Judge0 Workers (Code Execution Sandbox) ───────────────────────────────
  workers:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 256M
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mujcode-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Judge0 PostgreSQL Database ────────────────────────────────────────────
  db:
    image: postgres:13-alpine
    container_name: judge0_db
    restart: unless-stopped
    env_file: judge0.conf
    volumes:
      - judge0_db_data:/var/lib/postgresql/data
    networks:
      - mujcode-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  # ── Judge0 Redis (Submission Queue) ───────────────────────────────────────
  redis:
    image: redis:7
    container_name: judge0_redis
    restart: unless-stopped
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    env_file: judge0.conf
    volumes:
      - judge0_redis_data:/data
    networks:
      - mujcode-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  judge0_db_data:
    name: judge0_db_data
  judge0_redis_data:
    name: judge0_redis_data

networks:
  mujcode-net:
    name: mujcode-network
    external: true

