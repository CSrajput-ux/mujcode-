apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-compiler-worker
  labels:
    app: compiler-worker
spec:
  replicas: {{ .Values.replicaCount.compilerWorker }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  selector:
    matchLabels:
      app: compiler-worker
  template:
    metadata:
      labels:
        app: compiler-worker
    spec:
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}-worker:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: REDIS_URI
              valueFrom:
                secretKeyRef:
                  name: {{ .Release.Name }}-secrets
                  key: redis-uri
          # Container Security: Drop ALL capabilities and apply RuntimeDefault seccomp profile
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false 
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          resources:
            {{- toYaml .Values.resources.compilerWorker | nindent 12 }}

{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-compiler-worker-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-compiler-worker
  minReplicas: {{ .Values.autoscaling.compilerWorker.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.compilerWorker.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.compilerWorker.targetCPUUtilizationPercentage }}
{{- end }}
