# ─── High-Performance Nginx Configuration ─────────────────────────────────────
# Tuned for 500k+ requests/second throughput with multi-worker Node.js backend

worker_processes auto;           # 1 worker per CPU core
worker_rlimit_nofile 100000;     # Max open files per worker

events {
    worker_connections  16384;   # Per-worker connections (was 4096)
    use                 epoll;   # Linux: most efficient I/O event model
    multi_accept        on;      # Accept all pending connections at once
}

http {
    # ── Connection & Timeouts ──────────────────────────────────────────────────
    keepalive_timeout       65;
    keepalive_requests      10000;   # Reuse connection for 10k requests (was default 100)
    client_body_timeout     10;
    client_header_timeout   10;
    send_timeout            10;
    reset_timedout_connection on;

    # ── Buffer Tuning ──────────────────────────────────────────────────────────
    client_body_buffer_size    128k;
    client_max_body_size       25m;
    client_header_buffer_size  4k;
    large_client_header_buffers 4 16k;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;      # Batch send TCP packets
    tcp_nodelay         on;      # Low-latency for small packets
    server_tokens       off;     # Don't expose nginx version

    # ── Gzip Compression (offloads from Node.js) ──────────────────────────────
    gzip                on;
    gzip_comp_level     2;       # Fast compression (1=fastest, 9=smallest)
    gzip_min_length     1000;    # Only compress responses > 1KB
    gzip_vary           on;
    gzip_proxied        any;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/html
        text/xml
        application/xml;

    # ── Upstream Backend Cluster ───────────────────────────────────────────────
    upstream backend_cluster {
        least_conn;              # Route to least-busy backend (better than round-robin)
        server backend:5000;
        keepalive 256;           # Keep 256 persistent connections to backend (avoid TCP handshake per request)
    }

    # ── Rate Limiting Zone ────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=500r/s;
    limit_req_status 429;

    server {
        listen 80;
        server_name _;

        # ── Security Headers ─────────────────────────────────────────────────
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ── API Routes ────────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=2000 nodelay;

            proxy_pass          http://backend_cluster;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;
            proxy_set_header    Connection        "";  # Keeps upstream persistent connections active
            proxy_read_timeout  30s;
            proxy_send_timeout  30s;
        }

        # ── Socket.IO ─────────────────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass          http://backend_cluster;
            proxy_http_version  1.1;
            proxy_set_header    Upgrade    $http_upgrade;
            proxy_set_header    Connection "upgrade";
            proxy_set_header    Host       $host;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout  86400;     # Long-lived WebSocket connections
        }

        # ── Static Uploads ────────────────────────────────────────────────────
        location /uploads/ {
            proxy_pass         http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            add_header         Cache-Control "public, max-age=86400";
            proxy_cache_valid  200 1d;
        }

        # ── Catch-all ─────────────────────────────────────────────────────────
        location / {
            proxy_pass         http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   Connection "";
        }
    }
}
